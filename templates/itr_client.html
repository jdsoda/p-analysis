<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ client.client_name }}</title><style>body{font-family:Arial;background:#f4f6f8}.wrap{max-width:1000px;margin:35px auto;padding:0 18px}.card{background:#fff;padding:22px;border-radius:10px;margin-top:18px;border:1px solid #ddd}.btn{display:inline-block;padding:9px 14px;background:#1769aa;color:#fff;text-decoration:none;border-radius:6px;border:0}.year{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.muted{color:#667}</style></head><body><div class="wrap"><a href="{{ url_for('itr.clients') }}">← Clients</a><h1>{{ client.client_name }}</h1><div class="card"><b>Proprietor:</b> {{client.proprietor_name or '—'}} &nbsp; <b>PAN:</b> {{client.pan or '—'}}<h2>Financial Years</h2>{% for y in years %}<div class="year"><span><b>{{y.financial_year}}</b> <span class="muted">{{y.status}}</span></span><a class="btn" href="{{url_for('itr.year',fyid=y.id)}}">Open</a></div>{% else %}<p>No financial years yet.</p>{% endfor %}<h3>Create / Continue Year</h3><form method="post" action="{{url_for('itr.new_year',client_id=client.id)}}"><input name="financial_year" placeholder="2026-27" required><select name="previous_year_id"><option value="">No previous year</option>{% for y in years %}<option value="{{y.id}}">Use {{y.financial_year}} as base</option>{% endfor %}</select> <button class="btn">Create Year</button></form></div></div></body></html>
