<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ITR Clients</title><style>body{font-family:Arial;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:1100px;margin:35px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center}.btn{background:#1769aa;color:white;padding:10px 16px;border-radius:7px;text-decoration:none;border:0}.card{background:#fff;border:1px solid #ddd;border-radius:10px;margin-top:20px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{padding:13px;border-bottom:1px solid #eee;text-align:left}th{background:#f8fafc;font-size:13px}.open{color:#1769aa;text-decoration:none;font-weight:bold}</style></head><body><div class="wrap"><div class="top"><div><h1>ITR Clients</h1><p>Select an existing client or add a new one.</p></div><a class="btn" href="{{ url_for('itr.new_client') }}">+ Add Client</a></div><div class="card"><table><tr><th>Client</th><th>Proprietor</th><th>Latest FY</th><th>Action</th></tr>{% for c in clients %}<tr><td><b>{{ c.client_name }}</b></td><td>{{ c.proprietor_name or '' }}</td><td>{{ c.latest_fy or '—' }}</td><td><a class="open" href="{{ url_for('itr.client',client_id=c.id) }}">Open →</a></td></tr>{% else %}<tr><td colspan="4">No clients yet.</td></tr>{% endfor %}</table></div></div></body></html>
