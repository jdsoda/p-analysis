<!doctype html><html><head><meta charset="utf-8"><title>Add Client</title><style>body{font-family:Arial;background:#f4f6f8}.box{max-width:700px;margin:40px auto;background:#fff;padding:25px;border-radius:10px}label{display:block;margin-top:13px;font-weight:bold}input,textarea{width:100%;padding:10px;margin-top:6px;box-sizing:border-box}button{margin-top:20px;padding:11px 18px;background:#1769aa;color:#fff;border:0;border-radius:7px}</style></head><body><div class="box"><h1>Add ITR Client</h1><form method="post">{% for k,label in [('client_name','Client Name'),('proprietor_name','Proprietor / Partner'),('address','Address'),('pan','PAN'),('contact','Contact'),('business_type','Business Type'),('notes','Notes')] %}<label>{{label}}{% if k=='address' or k=='notes' %}<textarea name="{{k}}"></textarea>{% else %}<input name="{{k}}" {% if k=='client_name' %}required{% endif %}>{% endif %}</label>{% endfor %}<button>Save Client</button></form></div></body></html>
